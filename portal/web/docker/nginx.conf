# Serves the built SPA and keeps the public origin single-origin by proxying
# /api/ and /health to portal-api inside the `internal` Docker network — see
# infrastructure/caddy/game-on-portugal.pt.caddy, which reverse_proxies the
# whole domain to this container and expects it to do this split itself.
# `portal-api` below is the compose *service* name (infrastructure/game-on-portugal.yaml),
# resolvable on the shared `internal` network.
server {
    listen 8080;   # non-root: see docker/Dockerfile for why this is not 80
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Caddy terminates TLS and reaches us over plain HTTP, so $scheme here is
    # always "http" and is NOT what the browser used. Forward Caddy's own
    # X-Forwarded-Proto instead, and pass Host through on every proxied
    # location — portal-api builds its public URLs (OAuth redirect_uri,
    # sitemap entries) from these. See portal/api/src/lib/publicOrigin.ts.
    location /api/ {
        proxy_pass http://portal-api:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /health {
        proxy_pass http://portal-api:3001/health;
        proxy_set_header Host $host;
    }

    # M8.13 — sitemap.xml lists live ad ids, so it is generated by portal-api
    # (src/routes/seo.ts), not shipped as a static build asset. robots.txt
    # never needs live data, so it is a plain static file under public/.
    location = /sitemap.xml {
        proxy_pass http://portal-api:3001/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Content-addressed build assets — safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback: any unmatched path serves index.html, client-side router
    # (react-router) decides what to render.
    location / {
        try_files $uri /index.html;
    }
}
