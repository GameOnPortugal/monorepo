name: Docker Build

# Validates that the production image builds (no push). Runs only when the
# relevant files changed. The real build-and-push happens in deploy.yml on
# merge to main.
on:
  pull_request:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      bot: ${{ steps.filter.outputs.bot }}
      portal-api: ${{ steps.filter.outputs.portal-api }}
      portal-web: ${{ steps.filter.outputs.portal-web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            bot:
              - 'discord-bot/**'
            portal-api:
              - 'portal/api/**'
              - 'discord-bot/prisma/**'
            portal-web:
              - 'portal/web/**'

  bot:
    name: Build bot image
    needs: changes
    if: ${{ needs.changes.outputs.bot == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          docker build \
            -f discord-bot/docker/Dockerfile \
            --target runtime \
            --build-arg APP_ENV=prod \
            -t game-on-portugal-bot:ci \
            discord-bot

  portal-api:
    name: Build portal-api image
    needs: changes
    if: ${{ needs.changes.outputs.portal-api == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Context is the repo root — see portal/api/docker/Dockerfile's header.
      - name: Build
        run: |
          docker build \
            -f portal/api/docker/Dockerfile \
            -t game-on-portugal-portal-api:ci \
            .

  portal-web:
    name: Build portal-web image
    needs: changes
    if: ${{ needs.changes.outputs.portal-web == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          docker build \
            -f portal/web/docker/Dockerfile \
            -t game-on-portugal-portal-web:ci \
            portal/web
