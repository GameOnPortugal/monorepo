name: Deploy

# Build + push the production image(s) to Docker Hub, then roll the Portainer
# stack on HTZ1. Runs on every merge to main and can be triggered manually.
# The deploy reaches the firewalled Portainer API through an SSH tunnel
# (see .github/actions/portainer-deploy).
#
# NOTE: until the migration in docs/plans/04-infrastructure-migration.md is done,
# production still runs by hand on TedRelayer and this workflow deploys nothing
# real. Do not enable the required secrets/variables until cutover.

on:
  # DISABLED until the migration cutover (plan 04, phase 3 step 19).
  #
  # Two reasons this must not auto-run yet:
  #  1. DOCKER_USERNAME/DOCKER_PASSWORD are still live from 2025, so this WOULD
  #     succeed in pushing `joshlopes/game-on-portugal-bot:latest` — overwriting
  #     the exact image production pulls on TedRelayer, i.e. the rollback
  #     artifact, before there is anywhere new to deploy to.
  #  2. The Portainer step has no secrets yet and would fail on every merge,
  #     training everyone to ignore a red pipeline.
  #
  # Re-enable by uncommenting this block once phase 3 is done.
  #
  # push:
  #   branches: [main]
  #   paths:
  #     - 'discord-bot/**'
  #     - 'infrastructure/**'
  #     - '.github/workflows/deploy.yml'
  #     - '.github/actions/portainer-deploy/**'
  workflow_dispatch: ~

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  BOT_IMAGE: joshlopes/game-on-portugal-bot

jobs:
  build-bot:
    name: Build & push bot image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./discord-bot
          file: ./discord-bot/docker/Dockerfile
          target: runtime
          build-args: APP_ENV=prod
          push: true
          tags: |
            ${{ env.BOT_IMAGE }}:latest
            ${{ env.BOT_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=bot
          cache-to: type=gha,mode=max,scope=bot

  deploy:
    name: Deploy to Portainer
    needs: [build-bot]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy stack to Portainer
        uses: ./.github/actions/portainer-deploy
        with:
          ssh-host: ${{ vars.DEPLOY_SSH_HOST }}
          ssh-user: ${{ vars.DEPLOY_SSH_USER }}
          ssh-port: ${{ vars.DEPLOY_SSH_PORT }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          ssh-known-hosts: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          portainer-access-token: ${{ secrets.PORTAINER_ACCESS_TOKEN }}
          stack-id: ${{ vars.PORTAINER_STACK_ID }}
          endpoint-id: ${{ vars.PORTAINER_ENDPOINT_ID }}
          stack-file: infrastructure/game-on-portugal.yaml
          version: ${{ github.sha }}

      - name: Notify Telegram
        if: always()
        uses: ./.github/actions/send-telegram-message
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          thread-id: ${{ secrets.TELEGRAM_THREAD_ID }}
          message: "${{ job.status == 'success' && '✅' || '❌' }} Game On Portugal deployed to HTZ1 (${{ job.status }})"
