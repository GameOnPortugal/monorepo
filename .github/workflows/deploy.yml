name: Deploy

# Build + push the production image(s) to Docker Hub, then roll the Portainer
# stack on HTZ1. Runs on every merge to main and can be triggered manually.
# The deploy reaches the firewalled Portainer API through an SSH tunnel
# (see .github/actions/portainer-deploy).
#
# NOTE: production cut over to HTZ1 on 2026-08-19 (plan 04, phases 0-3). This
# now deploys for real on every merge to main — see docs/operations.md.

on:
  push:
    branches: [main]
    paths:
      - 'discord-bot/**'
      - 'portal/**'
      - 'infrastructure/**'
      - '.github/workflows/deploy.yml'
      - '.github/actions/portainer-deploy/**'
  workflow_dispatch: ~

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  BOT_IMAGE: joshlopes/game-on-portugal-bot
  PORTAL_API_IMAGE: joshlopes/game-on-portugal-portal-api
  PORTAL_WEB_IMAGE: joshlopes/game-on-portugal-portal-web

jobs:
  build-bot:
    name: Build & push bot image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./discord-bot
          file: ./discord-bot/docker/Dockerfile
          target: runtime
          build-args: APP_ENV=prod
          push: true
          tags: |
            ${{ env.BOT_IMAGE }}:latest
            ${{ env.BOT_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=bot
          cache-to: type=gha,mode=max,scope=bot

  build-portal-api:
    name: Build & push portal-api image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Context is the repo root, not portal/api — the image needs
      # discord-bot/prisma to generate a Prisma client (never to migrate).
      # See portal/api/docker/Dockerfile's header comment.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./portal/api/docker/Dockerfile
          push: true
          tags: |
            ${{ env.PORTAL_API_IMAGE }}:latest
            ${{ env.PORTAL_API_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=portal-api
          cache-to: type=gha,mode=max,scope=portal-api

  build-portal-web:
    name: Build & push portal-web image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./portal/web
          file: ./portal/web/docker/Dockerfile
          push: true
          tags: |
            ${{ env.PORTAL_WEB_IMAGE }}:latest
            ${{ env.PORTAL_WEB_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=portal-web
          cache-to: type=gha,mode=max,scope=portal-web

  deploy:
    name: Deploy to Portainer
    needs: [build-bot, build-portal-api, build-portal-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy stack to Portainer
        uses: ./.github/actions/portainer-deploy
        with:
          ssh-host: ${{ vars.DEPLOY_SSH_HOST }}
          ssh-user: ${{ vars.DEPLOY_SSH_USER }}
          ssh-port: ${{ vars.DEPLOY_SSH_PORT }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          ssh-known-hosts: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          portainer-access-token: ${{ secrets.PORTAINER_ACCESS_TOKEN }}
          stack-id: ${{ vars.PORTAINER_STACK_ID }}
          endpoint-id: ${{ vars.PORTAINER_ENDPOINT_ID }}
          stack-file: infrastructure/game-on-portugal.yaml
          version: ${{ github.sha }}
          # Fail the deploy if the bot does not actually stay up. Portainer
          # accepting the stack is not evidence the container survives boot,
          # and `restart: unless-stopped` hides a crash loop indefinitely.
          health-check-container: gop-bot

      - name: Notify Telegram
        if: always()
        uses: ./.github/actions/send-telegram-message
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          thread-id: ${{ secrets.TELEGRAM_THREAD_ID }}
          message: "${{ job.status == 'success' && '✅' || '❌' }} Game On Portugal deployed to HTZ1 (${{ job.status }})"
