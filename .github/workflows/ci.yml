name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref (keeps the latest push authoritative).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      bot: ${{ steps.filter.outputs.bot }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            bot:
              - 'discord-bot/**'
              - '.github/workflows/ci.yml'

  bot:
    name: Bot — typecheck & test
    needs: changes
    if: ${{ needs.changes.outputs.bot == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2"

      # Prisma's preinstall hook requires Node >= 18.18.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: discord-bot
        run: bun install --frozen-lockfile

      # MUST come before typecheck: without a generated client, tsc reports ~30
      # phantom "implicitly has an 'any' type" errors from the missing types.
      - name: Generate Prisma client
        working-directory: discord-bot
        run: bunx prisma generate

      - name: Type-check
        working-directory: discord-bot
        run: bunx tsc --noEmit

      # Both docker-compose.ci.yml services declare env_file: .env, and Compose
      # resolves env_file for every service up front when it parses the file --
      # even for `docker compose up -d --wait mariadb`, which never touches the
      # discord-bot service's env_file at all. So .env has to exist before the
      # *first* docker compose invocation in this job, not just before Test.
      - name: Prepare test environment
        working-directory: discord-bot
        run: cp .env.test .env

      # Schema-drift gate: fails if prisma/schema.prisma no longer produces the
      # same shape as replaying prisma/migrations. Uses the CI MariaDB (defined
      # below and reused by the Test step) as scratch space for a shadow
      # database — brought up empty here, diffed, and handed off to the Test
      # step which applies the real migrations on top.
      - name: Check schema drift
        working-directory: discord-bot
        run: |
          # `--wait` blocks on the healthcheck the compose file already declares.
          # Do NOT replace this with a hand-rolled `mariadb-admin ping` loop: during
          # initialisation the MariaDB entrypoint runs a *temporary* server to apply
          # setup, and that server answers ping before the root password exists — so
          # the ping succeeds and the very next statement fails with
          # `ERROR 1045 Access denied for user 'root'@'localhost'`. It is a race, so
          # it passes most of the time, which is the worst way for a gate to be wrong.
          docker compose -f docker-compose.ci.yml up -d --wait mariadb
          docker compose -f docker-compose.ci.yml exec -T mariadb mariadb -uroot -prootpassword -e "CREATE DATABASE IF NOT EXISTS discord_bot_shadow"
          bunx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "mysql://root:rootpassword@127.0.0.1:3306/discord_bot_shadow" \
            --exit-code

      # Integration tests need MariaDB. Run them inside the CI compose network so
      # the DB is reachable at `mariadb:3306` — no host port-mapping assumptions.
      - name: Test
        working-directory: discord-bot
        run: |
          docker compose -f docker-compose.ci.yml up -d
          # Wait for entrypoint.sh to have FINISHED its startup work -- not
          # merely for the container to be up. `exec ... true` (what this used
          # to be) succeeds while the entrypoint is still waiting on the DB or
          # midway through `prisma migrate deploy`, so `test:setup` below --
          # `prisma migrate reset --force`, a DROP of the whole schema -- raced
          # it: the deploy failed P1014, `set -e` killed the entrypoint, the
          # container exited, and the in-flight `exec` came back 137 with
          # nothing in the test output to explain it. See entrypoint.sh for
          # where the marker is written.
          timeout 300 bash -c 'until docker compose -f docker-compose.ci.yml exec -T discord-bot test -f /tmp/entrypoint-ready 2>/dev/null; do sleep 3; done'
          docker compose -f docker-compose.ci.yml exec -T discord-bot bun run test:setup
          docker compose -f docker-compose.ci.yml exec -T discord-bot bun test

      - name: Show app logs on failure
        if: failure()
        working-directory: discord-bot
        run: docker compose -f docker-compose.ci.yml logs

      - name: Tear down test stack
        if: always()
        working-directory: discord-bot
        run: docker compose -f docker-compose.ci.yml down -v

  quality:
    name: Bot — lint, format & audit
    needs: changes
    if: ${{ needs.changes.outputs.bot == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2"

      # Prisma's preinstall hook requires Node >= 18.18.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: discord-bot
        run: bun install --frozen-lockfile

      - name: Lint
        working-directory: discord-bot
        run: bun run lint

      - name: Format check
        working-directory: discord-bot
        run: bun run format:check

      # Supply-chain gate: reports high/critical advisories in the resolved
      # dependency tree on every run. Blocking as of M3 (dependency
      # currency): axios was dropped for native fetch, discord.js was bumped
      # to 14.27.0 (undici/ws no longer exact-pinned, so both float to
      # patched versions), winston-loki was replaced with a small direct
      # HTTP transport (dropping protobufjs/snappy), and the transitive
      # lodash pulled in by discord.js was overridden off the vulnerable
      # range. `bun audit` is clean — keep continue-on-error off. If a
      # future advisory can't be cleared immediately, prefer fixing it over
      # silencing this gate again.
      - name: Audit dependencies
        working-directory: discord-bot
        run: bun run audit

  # Single required status check — green when every triggered job is.
  ci:
    name: CI
    needs: [bot, quality]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify no job failed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || \
             [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "A required job failed or was cancelled."
            exit 1
          fi
          echo "All triggered jobs passed."
