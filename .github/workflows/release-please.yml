name: Release Please

# Maintains per-component release PRs + tags + CHANGELOGs from Conventional
# Commits on main. Deploys are driven separately by deploy.yml on merge — this
# only tracks versions.
#
# Why a PAT and not the default GITHUB_TOKEN: PRs opened with GITHUB_TOKEN do not
# trigger downstream workflows (GitHub's recursion guard), so the release PR
# would get no CI and its merge would not trigger the deploy. `RELEASE_PLEASE_TOKEN`
# is a fine-grained PAT with contents:write + pull-requests:write on this repo.
# A GitHub App token (actions/create-github-app-token) is the nicer option if the
# GameOnPortugal org ever gets an App — see infrastructure/SETUP.md.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
