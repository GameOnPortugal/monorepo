name: 'Deploy to Portainer'
description: 'Deploy a Docker Compose stack to Portainer over an SSH tunnel'

# Portainer's API (:9000 on the host) is firewalled and NOT reachable from
# GitHub Actions runner IPs — a direct curl just hangs ~137s and fails with
# curl exit 28. The host *is* reachable over SSH, and Portainer answers on the
# host's loopback, so we open a short-lived SSH tunnel
# (runner:local-port -> host:127.0.0.1:9000) and drive the API through it.
# The deploy key is locked down (forced command + permitopen=127.0.0.1:9000),
# so it can ONLY open this one tunnel — no shell, no other ports.

inputs:
  portainer-access-token:
    description: 'Portainer API access token'
    required: true
  stack-id:
    description: 'Portainer stack ID to update'
    required: true
  endpoint-id:
    description: 'Portainer endpoint ID'
    required: true
  stack-file:
    description: 'Path to the stack file (docker-compose yaml)'
    required: true
  version:
    description: 'Version to deploy (replaces ${APP_VERSION} in stack file)'
    required: true
  ssh-host:
    description: 'Host running Portainer, reachable over SSH'
    required: true
  ssh-user:
    description: 'SSH user for the deploy tunnel'
    required: true
  ssh-port:
    description: 'SSH port'
    required: false
    default: '22'
  ssh-key:
    description: 'Private SSH key for the tunnel-only deploy account'
    required: true
  ssh-known-hosts:
    description: 'Pinned known_hosts line(s) for the SSH host'
    required: true
  local-port:
    description: 'Local port on the runner to bind the tunnel to'
    required: false
    default: '9000'
  health-check-container:
    description: >-
      Container name to verify after the deploy. The step polls it through
      Portainer's Docker API proxy and fails the deploy if it is not running,
      or if it restarts during the observation window. Leave empty to skip.
    required: false
    default: ''
  health-check-settle-seconds:
    description: 'How long to let the container settle before the first sample'
    required: false
    default: '20'
  health-check-window-seconds:
    description: 'How long to watch for restarts after it first reports running'
    required: false
    default: '45'

runs:
  using: 'composite'
  steps:
    - name: Prepare stack file with version
      id: prepare-stack
      shell: bash
      run: |
        # Replace APP_VERSION placeholder with actual version
        sed "s/\${APP_VERSION}/${{ inputs.version }}/g" ${{ inputs.stack-file }} > /tmp/stack.yaml
        echo "Stack file prepared with version ${{ inputs.version }}"

    - name: Open SSH tunnel to Portainer
      shell: bash
      env:
        SSH_KEY: ${{ inputs.ssh-key }}
        SSH_KNOWN_HOSTS: ${{ inputs.ssh-known-hosts }}
        SSH_HOST: ${{ inputs.ssh-host }}
        SSH_USER: ${{ inputs.ssh-user }}
        SSH_PORT: ${{ inputs.ssh-port }}
        LOCAL_PORT: ${{ inputs.local-port }}
      run: |
        set -euo pipefail
        KEYFILE="$RUNNER_TEMP/portainer_deploy_key"
        KNOWN_HOSTS="$RUNNER_TEMP/portainer_known_hosts"
        printf '%s\n' "$SSH_KEY" > "$KEYFILE"
        chmod 600 "$KEYFILE"
        printf '%s\n' "$SSH_KNOWN_HOSTS" > "$KNOWN_HOSTS"

        # Background tunnel: runner:LOCAL_PORT -> host:127.0.0.1:9000.
        # ExitOnForwardFailure makes ssh fail fast if the forward is rejected.
        ssh -f -N \
          -o IdentitiesOnly=yes \
          -o StrictHostKeyChecking=yes \
          -o UserKnownHostsFile="$KNOWN_HOSTS" \
          -o ConnectTimeout=15 \
          -o ServerAliveInterval=15 \
          -o ServerAliveCountMax=3 \
          -o ExitOnForwardFailure=yes \
          -i "$KEYFILE" \
          -L "${LOCAL_PORT}:127.0.0.1:9000" \
          -p "$SSH_PORT" \
          "${SSH_USER}@${SSH_HOST}"

        # Confirm Portainer answers through the tunnel before we proceed.
        if curl -sf --max-time 15 -o /dev/null "http://localhost:${LOCAL_PORT}/api/system/status"; then
          echo "✅ SSH tunnel to Portainer established (localhost:${LOCAL_PORT})"
        else
          echo "❌ Could not reach Portainer through the SSH tunnel"
          exit 1
        fi

    - name: Fetch current stack from Portainer
      id: fetch-stack
      shell: bash
      env:
        PORTAINER_TOKEN: ${{ inputs.portainer-access-token }}
        LOCAL_PORT: ${{ inputs.local-port }}
      run: |
        # GET /api/stacks/{id} to retrieve current stack definition
        HTTP_STATUS=$(curl -s --connect-timeout 10 --max-time 30 \
          -o /tmp/current_stack.json -w "%{http_code}" \
          -X GET \
          -H "X-API-Key: $PORTAINER_TOKEN" \
          "http://localhost:${LOCAL_PORT}/api/stacks/${{ inputs.stack-id }}")

        if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
          echo "✅ Successfully fetched current stack definition"
          # Extract Env array and save to file (no logging of values)
          jq '.Env // []' /tmp/current_stack.json > /tmp/current_env.json
          echo "Found $(jq length /tmp/current_env.json) environment variables"
        else
          echo "❌ Failed to fetch current stack (HTTP $HTTP_STATUS)"
          exit 1
        fi

    - name: Deploy stack to Portainer
      shell: bash
      env:
        PORTAINER_TOKEN: ${{ inputs.portainer-access-token }}
        LOCAL_PORT: ${{ inputs.local-port }}
      run: |
        STACK_CONTENT=$(cat /tmp/stack.yaml)

        # Build the JSON payload with stackFileContent and preserved Env
        jq -n \
          --arg content "$STACK_CONTENT" \
          --slurpfile env /tmp/current_env.json \
          '{
            "stackFileContent": $content,
            "env": $env[0],
            "prune": true,
            "pullImage": true
          }' > /tmp/update_payload.json

        # Generous max-time: the PUT triggers a synchronous image pull on the host.
        HTTP_STATUS=$(curl -s --connect-timeout 10 --max-time 600 \
          -o /tmp/response.json -w "%{http_code}" \
          -X PUT \
          -H "X-API-Key: $PORTAINER_TOKEN" \
          -H "Content-Type: application/json" \
          "http://localhost:${LOCAL_PORT}/api/stacks/${{ inputs.stack-id }}?endpointId=${{ inputs.endpoint-id }}" \
          -d @/tmp/update_payload.json)

        echo "HTTP Status: $HTTP_STATUS"
        # Only log non-sensitive response metadata
        jq '{Id, Name, Status, CreationDate, UpdateDate}' /tmp/response.json 2>/dev/null || echo "Could not parse response"

        if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
          echo "✅ Stack deployed successfully!"
        else
          echo "❌ Failed to deploy stack"
          # Log error message only (Portainer error responses don't contain secrets)
          jq '.message // .error // .' /tmp/response.json 2>/dev/null || cat /tmp/response.json
          exit 1
        fi

    - name: Verify the deployed container stays up
      if: ${{ inputs.health-check-container != '' }}
      shell: bash
      env:
        PORTAINER_TOKEN: ${{ inputs.portainer-access-token }}
        LOCAL_PORT: ${{ inputs.local-port }}
        CONTAINER: ${{ inputs.health-check-container }}
        SETTLE: ${{ inputs.health-check-settle-seconds }}
        WINDOW: ${{ inputs.health-check-window-seconds }}
      run: |
        set -uo pipefail

        # Why this step exists.
        #
        # A successful PUT to /api/stacks only means Portainer accepted the
        # stack and started the containers. It says nothing about whether they
        # STAY started -- and `restart: unless-stopped` will happily restart a
        # container that dies on boot, forever, without anything reporting a
        # failure. On 2026-08-20 the bot crash-looped for hours on an
        # unresolvable DI binding while four consecutive deploys all reported
        # green, and the healthcheck declared on the service never ran, because
        # Docker does not run healthchecks against a container that is
        # restarting. It was found by hand, over SSH, during an unrelated check.
        #
        # The deploy SSH key is tunnel-only (forced command,
        # permitopen=127.0.0.1:9000), so `docker inspect` over SSH is not
        # available here by design. Portainer proxies the Docker API through
        # that same tunnel, which is how this reads container state without
        # widening the key's permissions.
        API="http://localhost:${LOCAL_PORT}/api/endpoints/${{ inputs.endpoint-id }}/docker"

        inspect() {
          curl -s --connect-timeout 10 --max-time 30 \
            -H "X-API-Key: $PORTAINER_TOKEN" \
            "${API}/containers/${CONTAINER}/json"
        }

        dump_logs() {
          echo "--- last 60 log lines from ${CONTAINER} ---"
          # Docker multiplexes stdout/stderr with an 8-byte header per frame
          # when the container has no TTY; strip the non-printable bytes so
          # the output is readable in the Actions log.
          curl -s --connect-timeout 10 --max-time 30 \
            -H "X-API-Key: $PORTAINER_TOKEN" \
            "${API}/containers/${CONTAINER}/logs?stdout=1&stderr=1&tail=60" \
            | tr -d '\000-\010\013\014\016-\037' || echo "(could not fetch logs)"
          echo "--- end of logs ---"
        }

        echo "Letting ${CONTAINER} settle for ${SETTLE}s after the stack update..."
        sleep "$SETTLE"

        FIRST=$(inspect)
        if [ -z "$FIRST" ] || ! echo "$FIRST" | jq -e '.State' > /dev/null 2>&1; then
          echo "❌ Could not inspect ${CONTAINER} through Portainer's Docker API."
          echo "$FIRST" | head -c 500
          exit 1
        fi

        FIRST_STATUS=$(echo "$FIRST" | jq -r '.State.Status')
        FIRST_RESTARTS=$(echo "$FIRST" | jq -r '.RestartCount')
        echo "${CONTAINER}: status=${FIRST_STATUS} restartCount=${FIRST_RESTARTS}"

        if [ "$FIRST_STATUS" != "running" ]; then
          echo "❌ ${CONTAINER} is '${FIRST_STATUS}', not 'running', ${SETTLE}s after the deploy."
          echo "   'restarting' means it is crash-looping: the process dies on boot and"
          echo "   Docker keeps restarting it. The logs below are from the last attempt."
          dump_logs
          exit 1
        fi

        echo "Watching ${CONTAINER} for ${WINDOW}s to make sure it does not restart..."
        sleep "$WINDOW"

        SECOND=$(inspect)
        SECOND_STATUS=$(echo "$SECOND" | jq -r '.State.Status')
        SECOND_RESTARTS=$(echo "$SECOND" | jq -r '.RestartCount')
        echo "${CONTAINER}: status=${SECOND_STATUS} restartCount=${SECOND_RESTARTS}"

        if [ "$SECOND_STATUS" != "running" ]; then
          echo "❌ ${CONTAINER} was running but is now '${SECOND_STATUS}' -- it died after boot."
          dump_logs
          exit 1
        fi

        # A container that boots, runs for a few seconds and then dies passes
        # the status check on both samples if the restart happens to land
        # between them. The restart *counter* is what catches that.
        if [ "$SECOND_RESTARTS" != "$FIRST_RESTARTS" ]; then
          echo "❌ ${CONTAINER} restarted during the observation window"
          echo "   (${FIRST_RESTARTS} -> ${SECOND_RESTARTS}). It is not stable."
          dump_logs
          exit 1
        fi

        echo "✅ ${CONTAINER} has been up and stable for ${WINDOW}s (restartCount=${SECOND_RESTARTS})"

    - name: Close SSH tunnel
      if: always()
      shell: bash
      env:
        LOCAL_PORT: ${{ inputs.local-port }}
      run: |
        # Tear down the background tunnel (runner is ephemeral, but keep it tidy).
        pkill -f "${LOCAL_PORT}:127.0.0.1:9000" 2>/dev/null || true
        echo "Tunnel closed"
