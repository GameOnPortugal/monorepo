services:
  discord-bot:
    init: true
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: test
      args:
        - APP_ENV=test
    container_name: discord-bot-ts
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-3000}:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
    healthcheck:
      # No HTTP endpoint exists yet (see docker/Dockerfile / entrypoint.sh
      # notes), so this is a process check: is the bot's main process alive.
      test: [ "CMD-SHELL", "pgrep -f 'bun run src/index.ts' > /dev/null || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      - mariadb

  mariadb:
    image: mariadb:11.7.2
    container_name: discord-bot-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: discord_bot
      MARIADB_USER: botuser
      MARIADB_PASSWORD: botpassword
    volumes:
      - mariadb-data:/var/lib/mysql
    ports:
      - "${DATABASE_PORT:-3306}:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: [ "CMD", "/usr/local/bin/healthcheck.sh", "--su-mysql", "--connect", "--innodb_initialized" ]
      interval: 2s
      retries: 120

volumes:
  mariadb-data:
