# Game On Portugal — Portainer Stack Definition (HTZ1, 195.201.192.35)
#
# Deployed via GitHub Actions (.github/workflows/deploy.yml) → Portainer API
# over an SSH tunnel. Secrets (Discord token, DB password, MinIO keys) are
# managed as Portainer **stack environment variables**, NOT in this file.
# `${APP_VERSION}` is substituted by the deploy action with the commit SHA.
#
# Public URLs (Caddy on the host terminates TLS — see infrastructure/caddy/):
#   https://game-on-portugal.pt        → gop-portal-web:80   (added by plan 03)
#   https://media.game-on-portugal.pt  → gop-minio:9000      (public-read bucket)
#
# This is the live production stack (id 46, endpoint 3) since the 2026-08-19
# cutover — see docs/plans/04-infrastructure-migration.md and docs/operations.md.

services:
  # --- Discord bot ---------------------------------------------------------
  bot:
    image: docker.io/joshlopes/game-on-portugal-bot:${APP_VERSION:-latest}
    container_name: gop-bot
    environment:
      APP_ENV: prod
      # entrypoint.sh waits for the DB, runs `prisma migrate deploy`, then boots.
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in the Portainer stack env}@db:3306/discord-bot
      # Absent DISCORD_TOKEN silently binds InMemoryClient — the bot starts and
      # does nothing. Fail the deploy instead.
      DISCORD_TOKEN: ${DISCORD_TOKEN:?set DISCORD_TOKEN in the Portainer stack env}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?set DISCORD_CLIENT_ID in the Portainer stack env}
      # Object storage for re-hosted screenshots and marketplace photos.
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-https://media.game-on-portugal.pt}
      S3_BUCKET: ${S3_BUCKET:-gop-media}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-gameonportugal}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in the Portainer stack env (min 8 chars)}
      # Optional Grafana Loki shipping. Leave unset to log to stdout only.
      LOKI_HOST: ${LOKI_HOST:-}
      LOKI_AUTH: ${LOKI_AUTH:-}
      APP_VERSION: ${APP_VERSION:-latest}
    restart: unless-stopped
    healthcheck:
      # No HTTP endpoint exists yet (see discord-bot/docker/Dockerfile — EXPOSE
      # 3000 is aspirational, nothing listens on it). This is a process check
      # so Portainer/`docker ps` can at least tell the bot's main process is
      # alive; a real /health endpoint (needs src/ changes) is the follow-up.
      test: [ "CMD-SHELL", "pgrep -f 'bun run src/index.ts' > /dev/null || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    networks:
      - internal

  # --- MariaDB -------------------------------------------------------------
  # 11.7 to match the version the test suite runs against. The data is restored
  # from a logical dump of the 11.5.2 instance on TedRelayer (see plan 04).
  db:
    image: mariadb:11.7.2
    container_name: gop-db
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in the Portainer stack env}
      MARIADB_DATABASE: discord-bot
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--su-mysql", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - internal

  # --- Object storage (MinIO, S3-compatible) -------------------------------
  # Holds re-hosted screenshots and marketplace photos. Discord CDN URLs expire,
  # which is why all 624 historical screenshot images are dead (issue #19) —
  # nothing user-visible may ever again depend on a Discord-hosted URL.
  minio:
    image: minio/minio:latest
    container_name: gop-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-gameonportugal}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY in the Portainer stack env (min 8 chars)}
      # Rewrites presigned/console URLs to the public origin behind Caddy.
      MINIO_BROWSER_REDIRECT_URL: ${S3_CONSOLE_URL:-https://media.game-on-portugal.pt/console}
    volumes:
      - minio_data:/data
    restart: unless-stopped
    networks:
      - proxy      # Caddy serves the bucket at media.game-on-portugal.pt
      - internal

  # One-shot: wait for MinIO, create the media bucket, make it public-read.
  # Idempotent — safe on every deploy.
  createbuckets:
    image: minio/mc:latest
    container_name: gop-createbuckets
    depends_on:
      - minio
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-gameonportugal}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in the Portainer stack env (min 8 chars)}
      S3_BUCKET: ${S3_BUCKET:-gop-media}
    entrypoint: >
      /bin/sh -c "set -e;
      until mc alias set local http://minio:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY; do echo 'waiting for minio…'; sleep 1; done;
      mc mb --ignore-existing local/$$S3_BUCKET;
      mc anonymous set download local/$$S3_BUCKET;
      echo 'bucket ready (public read)'"
    networks:
      - internal

  # --- Nightly database backup --------------------------------------------
  backup:
    image: databack/mysql-backup:v0.12.0
    container_name: gop-db-backup
    environment:
      DB_SERVER: db
      DB_PORT: "3306"
      DB_USER: root
      DB_PASS: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in the Portainer stack env}
      DB_DUMP_TARGET: ${DB_DUMP_TARGET:-/backup}
      DB_DUMP_BY_SCHEMA: "true"
      DB_DUMP_FREQ: "1440"        # daily
      DB_DUMP_RETENTION: "30d"
    volumes:
      - backup_data:/backup
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  # --- Portal (added by docs/plans/03-portal.md, scaffolded M8.2/M8.3/M8.5) -
  # Read-only over the bot's schema (see portal/api/src/db.ts) — never runs a
  # migration. deploy.yml builds and pushes both images alongside the bot's on
  # every push to main, so by the time this stack file lands `docker compose
  # pull`/Portainer has something to pull.
  portal-api:
    image: docker.io/joshlopes/game-on-portugal-portal-api:${APP_VERSION:-latest}
    container_name: gop-portal-api
    environment:
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in the Portainer stack env}@db:3306/discord-bot
      PORT: "3001"
      # --- M8.10 admin OAuth (all optional — see portal/api/.env.example for
      # the full setup runbook incl. the Discord Developer Portal redirect
      # URIs). Unset means "no admin surface": /api/auth/* and /api/admin/*
      # answer 503, every public page/route is unaffected — same
      # degrade-safely contract as the bot's own DISCORD_TOKEN (AGENT.md
      # "Traps"). DISCORD_CLIENT_ID is already required above for the bot and
      # is not a secret (it's public in every OAuth URL); reused here rather
      # than duplicated under a second name.
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      # NEW secret Luis must create: Discord Developer Portal -> the Game On
      # Portugal application -> OAuth2 -> Client Secret -> Reset Secret ->
      # set as a Portainer stack environment variable (not in this file).
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-818108848492773377}
      # NEW secret Luis must create: any random 32+ byte value, e.g.
      # `openssl rand -hex 32`, set as a Portainer stack environment
      # variable. Signs the admin session cookie — there is no session
      # table (src/lib/session.ts explains why), so this is what makes a
      # session unforgeable. Rotating it logs out every admin.
      SESSION_SECRET: ${SESSION_SECRET:-}
      # --- M8.11 audit log: a private SQLite file this service owns (not a
      # MySQL table — the bot owns that schema, see portal/README.md), kept
      # on the volume below so it survives redeploys.
      AUDIT_DB_PATH: /data/audit.db
    volumes:
      - portal_audit_data:/data
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  portal-web:
    image: docker.io/joshlopes/game-on-portugal-portal-web:${APP_VERSION:-latest}
    container_name: gop-portal-web
    restart: unless-stopped
    depends_on:
      - portal-api
    networks:
      - proxy      # Caddy serves this at game-on-portugal.pt (see infrastructure/caddy/)
      - internal   # nginx inside this image proxies /api/ and /health to portal-api

networks:
  # Shared with the host's Caddy; must already exist (`docker network create proxy`).
  proxy:
    external: true
  internal:
    driver: bridge

volumes:
  db_data:
  minio_data:
  backup_data:
  # M8.11's admin audit log (portal/api/src/audit/db.ts) — a private SQLite
  # file portal-api owns outright, unrelated to the bot's MySQL database.
  portal_audit_data:
